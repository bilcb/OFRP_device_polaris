name: OrangeFox - Build

# Credits to:
# https://github.com/TeamWin
# https://gitlab.com/OrangeFox
# https://github.com/azwhikaru for Recovery Builder Template
# And all Contributors in every repositories I used

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: 'OrangeFox Manifest Branch'
        required: true
        default: '12.1'
        type: choice
        options:
        - 14.1
        - 12.1
      DEVICE_TREE:
        description: 'OrangeFox Device Tree'
        required: true
        default: 'https://github.com/bilcb/OFRP_device_polaris.git'
      DEVICE_TREE_BRANCH:
        description: 'OrangeFox Device Tree Branch'
        required: true
        default: 'main'
      DEVICE_PATH:
        description: 'Specify your Device Path'
        required: true
        default: 'device/xiaomi/polaris'
      DEVICE_NAME:
        description: 'Specify your Device Codename'
        required: true
        default: 'polaris'
      BUILD_TARGET:
        description: 'Specify your Build Target'
        required: true
        default: 'recovery'
        type: choice
        options:
        - boot
        - recovery
      CUSTOM_VARS:
        description: 'Edit the vars in vendorsetup.sh (e.g. FOX_USE_KEYMASTER_4=0|FOX_USE_DYNAMIC_PARTITIONS=0)'
        required: false
        default: ''
      FILE_ENCRYPTION:
        description: 'Edit fileencryption in fstab/flags (e.g. aes-256-xts:aes-256-cts:v2 or ice)'
        required: false
        default: ''

jobs:
  build:
    name: Build OFR by ${{ github.actor }}
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DEVICE_TREE_URL: ''
      COMMIT_ID: ''
      BUILD_DATE: ''
    permissions:
      contents: write
    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Clean-up
      uses: rokibhasansagar/slimhub_actions@main

    - name: Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 24

    - name: Build Environment
      run: |
        sudo apt-get update
        sudo apt-get upgrade -y
        sudo apt-get install aria2 -y
        git clone https://gitlab.com/OrangeFox/misc/scripts.git -b master
        cd scripts
        sudo bash setup/android_build_env.sh

    - name: Set-up Manifest
      run: |
        mkdir -p ${GITHUB_WORKSPACE}/OrangeFox
        cd ${GITHUB_WORKSPACE}/OrangeFox
        git config --global user.name "${{ github.actor }}"
        git config --global user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
        git clone https://gitlab.com/OrangeFox/sync.git -b master
        cd sync
        ./orangefox_sync.sh --branch ${{ inputs.MANIFEST_BRANCH }} --path ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}

    - name: Clone Device Tree
      run: |
        cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}
        git clone ${{ inputs.DEVICE_TREE }} -b ${{ inputs.DEVICE_TREE_BRANCH }} ./${{ inputs.DEVICE_PATH }}
        cd ${{ inputs.DEVICE_PATH }}
        echo "COMMIT_ID=$(git rev-parse HEAD)" >> $GITHUB_ENV

    - name: Apply Custom Variables
      if: ${{ inputs.CUSTOM_VARS != '' }}
      run: |
        cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}
        VENDORSETUP="${{ inputs.DEVICE_PATH }}/vendorsetup.sh"
        IFS='|' read -ra VARS <<< "${{ inputs.CUSTOM_VARS }}"
        for line in "${VARS[@]}"; do
          line=$(echo "$line" | xargs)
          [[ "$line" =~ ^([A-Z_0-9]+)=(.*)$ ]] || continue
          VAR_NAME="${BASH_REMATCH[1]}"
          VAR_VALUE="${BASH_REMATCH[2]}"
          if grep -q "export ${VAR_NAME}=" "$VENDORSETUP"; then
            sed -i "s|export ${VAR_NAME}=.*|export ${VAR_NAME}=${VAR_VALUE}|" "$VENDORSETUP"
            echo "Replaced: ${VAR_NAME}=${VAR_VALUE}"
          else
            echo "export ${VAR_NAME}=${VAR_VALUE}" >> "$VENDORSETUP"
            echo "Appended: ${VAR_NAME}=${VAR_VALUE}"
          fi
        done

    - name: Modify File Encryption
      if: ${{ inputs.FILE_ENCRYPTION != '' }}
      run: |
        cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}/${{ inputs.DEVICE_PATH }}/recovery/fstab_files
        for f in *.fstab *.flags; do
          [ -f "$f" ] || continue
          sed -i -E "s|fileencryption=[^,;]*|fileencryption=${{ inputs.FILE_ENCRYPTION }}|g" "$f"
          echo "Modified: $f -> fileencryption=${{ inputs.FILE_ENCRYPTION }}"
        done

    - name: Building OrangeFox
      run: |
        cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}
        set +e
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true

        RELEASE=""
        RELEASE_DIR="build/release/aconfig"
        OUTPUT=$(lunch twrp_${{ inputs.DEVICE_NAME }}-nonexistent-eng 2>&1)

        if echo "$OUTPUT" | grep -q "Available releases are:" && [ -d "$RELEASE_DIR" ]; then
          for dir in "$RELEASE_DIR"/*/; do
            if [ -d "$dir" ]; then
              folder_name=$(basename "$dir")
              if echo "$OUTPUT" | grep -qw "$folder_name"; then
                RELEASE="$folder_name"
                break
              fi
            fi
          done
        fi

        if [ -n "$RELEASE" ]; then
          LUNCH_COMBO="twrp_${{ inputs.DEVICE_NAME }}-${RELEASE}-eng"
        else
          LUNCH_COMBO="twrp_${{ inputs.DEVICE_NAME }}-eng"
        fi

        set -e
        echo "COMMON_LUNCH_CHOICES := ${LUNCH_COMBO}"
        lunch "${LUNCH_COMBO}" && make clean && mka adbd ${{ inputs.BUILD_TARGET }}image

    - name: Set Release Properties
      run: |
        echo "BUILD_DATE=$(TZ=Asia/Manila date +%Y%m%d)" >> $GITHUB_ENV
        cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}

        DEVICE_TREE_URL="${{ inputs.DEVICE_TREE }}"
        if [[ "${DEVICE_TREE_URL}" == *.git ]]; then
          DEVICE_TREE_URL="${DEVICE_TREE_URL%.git}"
        fi
        echo "DEVICE_TREE_URL=${DEVICE_TREE_URL}" >> $GITHUB_ENV

    - name: Upload to Release
      uses: softprops/action-gh-release@v3
      with:
        files: |
          OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}/out/target/product/${{ inputs.DEVICE_NAME }}/OrangeFox*.img
          OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}/out/target/product/${{ inputs.DEVICE_NAME }}/OrangeFox*.zip
        name: OrangeFox Recovery for ${{ inputs.DEVICE_NAME }} // ${{ env.BUILD_DATE }}
        tag_name: ${{ github.run_id }}
        body: |
          ## OrangeFox Recovery Build - Unofficial
          Build: fox_${{ inputs.MANIFEST_BRANCH }}
          Device: [Device Tree/Branch](${{ env.DEVICE_TREE_URL }}/tree/${{ inputs.DEVICE_TREE_BRANCH }})
          Commit: Most recent [commit](${{ env.DEVICE_TREE_URL }}/commit/${{ env.COMMIT_ID }}) during building.
