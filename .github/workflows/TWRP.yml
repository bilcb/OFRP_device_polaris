name: TWRP 16 Builder

on:
  workflow_dispatch:
    inputs:
      TWRP_MANIFEST_URL:
        description: "TWRP manifest url"
        required: true
        default: "https://github.com/TWRP-Test/platform_manifest_twrp_aosp"
      TWRP_MANIFEST_BRANCH:
        description: "TWRP branch"
        required: true
        default: "twrp-16.0"
      DEVICE_TREE_URL:
        description: "Device tree url"
        required: true
        default: "https://github.com/bilcb/OFRP_device_polaris.git"
      DEVICE_TREE_BRANCH:
        description: "Device tree branch"
        required: true
        default: "main"
      DEVICE_PATH:
        description: "Device path device/"
        required: true
        default: "xiaomi/polaris"
      DEVICE_NAME:
        description: "Device name"
        required: true
        default: "polaris"
      LUNCH_TARGET:
        description: "lunch twrp_ (default same as device name)"
        required: false
        default: ""
      BUILD_PARTITION:
        description: "Build partition"
        required: true
        default: "recovery"
        type: choice
        options:
        - boot
        - recovery
      CUSTOM_VARS:
        description: 'Edit the vars in vendorsetup.sh (e.g. FOX_USE_KEYMASTER_4=0|FOX_USE_DYNAMIC_PARTITIONS=0)'
        required: false
        default: ''
      FILE_ENCRYPTION:
        description: 'Edit fileencryption in fstab/flags (e.g. aes-256-xts:aes-256-cts:v2 or ice)'
        required: false
        default: ''

jobs:
  build:
    name: Build TWRP by ${{ github.actor }}
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DEVICE_TREE_URL: ''
      COMMIT_ID: ''
      BUILD_DATE: ''
    permissions:
      contents: write
    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Show build info
      run: |
        if [ -n "${{ github.event.inputs.LUNCH_TARGET }}" ]; then
          echo "LUNCH_TARGET=${{ github.event.inputs.LUNCH_TARGET }}" >> "$GITHUB_ENV"
        else
          echo "LUNCH_TARGET=${{ github.event.inputs.DEVICE_NAME }}" >> "$GITHUB_ENV"
        fi
        {
          echo 'BUILD_INFO<<EOF'
          echo
          echo Manifest url: ${{ github.event.inputs.TWRP_MANIFEST_URL }}
          echo Manifest branch: ${{ github.event.inputs.TWRP_MANIFEST_BRANCH }}
          echo Device tree url: ${{ github.event.inputs.DEVICE_TREE_URL }}
          echo Device tree branch: ${{ github.event.inputs.DEVICE_TREE_BRANCH }}
          echo Device path: ${{ github.event.inputs.DEVICE_PATH }}
          echo Device name: ${{ github.event.inputs.DEVICE_NAME }}
          echo Lunch target: ${{ github.event.inputs.LUNCH_TARGET }}
          echo Build target: ${{ github.event.inputs.BUILD_PARTITION }}.img
          echo Build date: `date`
          echo
          echo EOF
        } >> "$GITHUB_ENV"
        echo BUILD_DATE=`date +%F` >> "$GITHUB_ENV"
        echo "REPO_NAME=$(basename ${{ github.event.inputs.TWRP_MANIFEST_URL }})" >> "$GITHUB_ENV"

    - name: Cleanup
      uses: rokibhasansagar/slimhub_actions@main

    - name: Maximize build space
      uses: easimon/maximize-build-space@master

    - name: Setup ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        create-symlink: true

    - name: Setup zram
      continue-on-error: true
      run: |
        sudo apt install zram-tools -y
        sudo modprobe zram
        sudo sed -i 's/^#PERCENT=50/PERCENT=90/' /etc/default/zramswap
        sudo sed -i 's/^#PRIORITY=100/PRIORITY=1000/' /etc/default/zramswap
        sudo systemctl restart zramswap
        zramctl

    - name: Setup environment
      run: |
        export DEBIAN_FRONTEND=noninteractive
        sudo apt update && sudo apt upgrade -y
        sudo apt install repo -y
        git config --global user.name ${{ github.actor }}
        git config --global user.email ${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com

    - name: Sync source
      run: |
        repo init -u ${{ github.event.inputs.TWRP_MANIFEST_URL }} -b ${{ github.event.inputs.TWRP_MANIFEST_BRANCH }} --depth=1
        (while true; do echo "Syncing source..."; sleep 60; done) &
        TIP_PID=$!
        repo sync
        kill $TIP_PID && exit 0

    - name: Setup device
      run: |
        git clone ${{ github.event.inputs.DEVICE_TREE_URL }} -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} device/${{ github.event.inputs.DEVICE_PATH }}
        cd device/${{ github.event.inputs.DEVICE_PATH }}
        echo "COMMIT_ID=$(git rev-parse HEAD)" >> $GITHUB_ENV

    - name: Apply Custom Variables
      if: ${{ github.event.inputs.CUSTOM_VARS != '' }}
      run: |
        VENDORSETUP="device/${{ github.event.inputs.DEVICE_PATH }}/vendorsetup.sh"
        IFS='|' read -ra VARS <<< "${{ github.event.inputs.CUSTOM_VARS }}"
        for line in "${VARS[@]}"; do
          line=$(echo "$line" | xargs)
          [[ "$line" =~ ^([A-Z_0-9]+)=(.*)$ ]] || continue
          VAR_NAME="${BASH_REMATCH[1]}"
          VAR_VALUE="${BASH_REMATCH[2]}"
          if grep -q "export ${VAR_NAME}=" "$VENDORSETUP"; then
            sed -i "s|export ${VAR_NAME}=.*|export ${VAR_NAME}=${VAR_VALUE}|" "$VENDORSETUP"
            echo "Replaced: ${VAR_NAME}=${VAR_VALUE}"
          else
            echo "export ${VAR_NAME}=${VAR_VALUE}" >> "$VENDORSETUP"
            echo "Appended: ${VAR_NAME}=${VAR_VALUE}"
          fi
        done

    - name: Modify File Encryption
      if: ${{ github.event.inputs.FILE_ENCRYPTION != '' }}
      run: |
        cd device/${{ github.event.inputs.DEVICE_PATH }}/recovery/fstab_files
        for f in *.fstab *.flags; do
          [ -f "$f" ] || continue
          sed -i -E "s|fileencryption=[^,;]*|fileencryption=${{ github.event.inputs.FILE_ENCRYPTION }}|g" "$f"
          echo "Modified: $f -> fileencryption=${{ github.event.inputs.FILE_ENCRYPTION }}"
        done

    - name: Set Release Properties
      run: |
        DEVICE_TREE_URL="${{ github.event.inputs.DEVICE_TREE_URL }}"
        if [[ "${DEVICE_TREE_URL}" == *.git ]]; then
          DEVICE_TREE_URL="${DEVICE_TREE_URL%.git}"
        fi
        echo "DEVICE_TREE_URL=${DEVICE_TREE_URL}" >> "$GITHUB_ENV"

    - name: Generate build info
      run: |
        echo -e "$BUILD_INFO" >> INFO.txt
        echo "Device tree: ${DEVICE_TREE_URL}/tree/${{ github.event.inputs.DEVICE_TREE_BRANCH }}" >> INFO.txt
        echo "Device tree commit: ${DEVICE_TREE_URL}/commit/${COMMIT_ID}" >> INFO.txt
        echo "Change log:" >> INFO.txt
        set +e
        LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null)
        if [ $? -eq 0 ]; then
          git log "$LAST_TAG"..HEAD --pretty=format:"- %h-%an: %s" >> INFO.txt
        else
          git log --pretty=format:"- %h-%an: %s" >> INFO.txt
        fi
        cat INFO.txt
      working-directory: device/${{ github.event.inputs.DEVICE_PATH }}

    - name: Build TWRP
      run: |
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        export CCACHE_DIR=.ccache
        export CCACHE_EXEC=$(command -v ccache)        
        export CCACHE_MAXSIZE=5G
        export USE_CCACHE=1
        set +e
        RELEASE=""
        RELEASE_DIR="build/release/aconfig"
        OUTPUT=$(lunch twrp_${{ env.LUNCH_TARGET }}-nonexistent-eng 2>&1)
        if echo "$OUTPUT" | grep -q "Available releases are:" && [ -d "$RELEASE_DIR" ]; then
          for dir in "$RELEASE_DIR"/*/; do
            if [ -d "$dir" ]; then
              folder_name=$(basename "$dir")
              if echo "$OUTPUT" | grep -qw "$folder_name"; then
                RELEASE="$folder_name"
                break
              fi
            fi
          done
        fi
        if [ -n "$RELEASE" ]; then
          LUNCH_COMBO="twrp_${{ env.LUNCH_TARGET }}-${RELEASE}-eng"
        else
          LUNCH_COMBO="twrp_${{ env.LUNCH_TARGET }}-eng"
        fi
        set -e
        echo "COMMON_LUNCH_CHOICES := ${LUNCH_COMBO}"
        lunch "${LUNCH_COMBO}"
        (while true; do echo `date +%T` "Building TWRP..."; free -h; sleep 10; done) &
        TIP_PID=$!
        m ${{ github.event.inputs.BUILD_PARTITION }}image
        mv out/target/product/${{ github.event.inputs.DEVICE_NAME }}/${{ github.event.inputs.BUILD_PARTITION }}.img out/target/product/${{ github.event.inputs.DEVICE_NAME }}/TWRP-3.7.1-16-${{ github.event.inputs.DEVICE_NAME }}-${{ env.BUILD_DATE }}.img
        kill $TIP_PID && exit 0        

    - name: Upload to Release
      uses: softprops/action-gh-release@v3
      with:
        files: | 
          out/target/product/${{ github.event.inputs.DEVICE_NAME }}/TWRP-3.7.1-16-${{ github.event.inputs.DEVICE_NAME }}-${{ env.BUILD_DATE }}.img
        name: TWRP-3.7.1-16-${{ github.event.inputs.DEVICE_NAME }}-${{ env.BUILD_DATE }}-${{ github.run_id }}
        tag_name: ${{ github.run_id }}
        body_path: device/${{ github.event.inputs.DEVICE_PATH }}/INFO.txt
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}